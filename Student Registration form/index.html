<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h2>Student Registration Form</h2>
        <hr>

        <form id="registrationForm">

            <label>Full Name:</label>
            <input type="text" id="name" placeholder="Enter your full name">

            <label>Email:</label>
            <input type="email" id="email" placeholder="Enter valid email address">

            <label>Password:</label>
            <input type="password" id="password" placeholder="Enter password">

            <label>Gender:</label>
            <div class="gender">
                <input type="radio" name="gender" value="Male"> Male
                <input type="radio" name="gender" value="Female"> Female
                <input type="radio" name="gender" value="Other"> Other
            </div>

            <label>Course:</label>
            <select id="course">
                <option value="">-- Select Course --</option>
                <option>B.Tech</option>
                <option>B.Sc</option>
                <option>B.Com</option>
                <option>BCA</option>
                <option>BA</option>
            </select>

            <label>Contact No:</label>
            <input type="tel" id="contact" placeholder="Enter phone number">
             <p id="num"></p>

            <label>Address:</label>
            <textarea id="address" rows="4" placeholder="Enter your address"></textarea>

            <!-- Additional Data Fields -->

            <label>Date of Birth:</label>
            <input type="date" id="dob">

            <label>College/University Name:</label>
            <input type="text" id="college" placeholder="Enter college name">

            <label>City:</label>
            <input type="text" id="city" placeholder="Enter your city">

            <div class="buttons">
                <input type="submit" value="Register">
                <input type="reset" value="Clear">
            </div>

            <p id="message"></p>

        </form>

        <hr>

        <p class="footer">© 2026 Student Registration Portal</p>

    </div>

    <script src="script.js"></script>

</body>
</html>
